<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق إدارة المصاريف الشخصية</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#fbf7ee',
                            100: '#f5ee35',
                            400: '#facc15',
                            500: '#eab308',
                            600: '#ca8a04',
                            900: '#14101e'
                        },
                        violetTheme: {
                            800: '#1e1435',
                            900: '#120b22',
                            950: '#0a0614'
                        }
                    },
                    fontFamily: {
                        cairo: ['Cairo', 'sans-serif']
                    }
                }
            }
        }
    </script>
    
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts Cairo -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Cairo', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #0a0614;
            background-image: 
                radial-gradient(at 10% 10%, rgba(126, 34, 206, 0.15) 0px, transparent 50%),
                radial-gradient(at 90% 90%, rgba(234, 179, 8, 0.1) 0px, transparent 50%);
            background-attachment: fixed;
            color: #f3f4f6;
            min-height: 100vh;
        }

        /* Glassmorphism Classes */
        .glass-panel {
            background: rgba(26, 18, 46, 0.65);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 179, 8, 0.15);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
        }

        .glass-panel-glow {
            background: rgba(30, 20, 53, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(234, 179, 8, 0.3);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.12);
        }

        .glass-header {
            background: rgba(10, 6, 20, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid rgba(234, 179, 8, 0.2);
        }

        /* Gold Neon Gradient Text */
        .gold-gradient-text {
            background: linear-gradient(135deg, #fffbeb 0%, #facc15 50%, #ca8a04 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Gold Glow Button */
        .gold-btn {
            background: linear-gradient(135deg, #facc15 0%, #eab308 50%, #ca8a04 100%);
            color: #0a0614;
            font-weight: 800;
            box-shadow: 0 4px 20px rgba(234, 179, 8, 0.25);
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .gold-btn:active {
            transform: scale(0.97);
        }

        @media (hover: hover) {
            .gold-btn:hover {
                box-shadow: 0 6px 28px rgba(234, 179, 8, 0.45);
                transform: translateY(-2px);
            }
        }

        /* Custom Scrollbar */
        .custom-scrollbar::-webkit-scrollbar {
            width: 5px;
            height: 5px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: rgba(15, 10, 30, 0.5);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: rgba(234, 179, 8, 0.4);
            border-radius: 10px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: rgba(234, 179, 8, 0.7);
        }

        /* Strict Image Dimension Enforcement */
        .avatar-img-fixed {
            width: 52px !important;
            height: 52px !important;
            min-width: 52px !important;
            min-height: 52px !important;
            max-width: 52px !important;
            max-height: 52px !important;
            object-fit: cover !important;
            border-radius: 16px;
        }

        .avatar-img-lg {
            width: 72px !important;
            height: 72px !important;
            min-width: 72px !important;
            min-height: 72px !important;
            max-width: 72px !important;
            max-height: 72px !important;
            object-fit: cover !important;
            border-radius: 20px;
        }

        .item-img-fixed {
            width: 56px !important;
            height: 56px !important;
            min-width: 56px !important;
            min-height: 56px !important;
            max-width: 56px !important;
            max-height: 56px !important;
            object-fit: cover !important;
            border-radius: 14px;
        }

        @media (min-width: 640px) {
            .item-img-fixed {
                width: 64px !important;
                height: 64px !important;
                min-width: 64px !important;
                min-height: 64px !important;
                max-width: 64px !important;
                max-height: 64px !important;
            }
        }

        /* Active Tab Indicator Effect */
        .tab-active {
            background: linear-gradient(135deg, #facc15 0%, #ca8a04 100%) !important;
            color: #0a0614 !important;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3) !important;
        }

        /* Soft fade-in animation */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .animate-fade-in {
            animation: fadeIn 0.35s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }
    </style>
</head>
<body class="flex flex-col justify-between selection:bg-amber-400 selection:text-black">

</div>

    <!-- MAIN CONTAINER -->

                    <!-- Item Form (Add / Edit) -->

                                <i class="fa-solid fa-pen-to-square text-amber-400 text-sm"></i>

    <!-- JAVASCRIPT APP LOGIC -->
    <script>
        // App State Management with LocalStorage persistence
        let appData = JSON.parse(localStorage.getItem('luxury_gold_expense_data')) || {
            userName: 'Raouf',
            userAvatar: 'https://placehold.co/150x150/1e1435/facc15?text=أنا',
            items: [
                
            ]
        };

        // Format Currency Helper
        function formatCurrency(amount) {
            return Number(amount).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        // Save Data & Update UI
        function saveData() {
            localStorage.setItem('luxury_gold_expense_data', JSON.stringify(appData));
            updateHeaderAndFooter();
            renderHomeItems();
            renderAdminItems();
        }

        // Switch Between Home & Admin Pages
        function switchPage(page) {
            const homePage = document.getElementById('homePage');
            const adminPage = document.getElementById('adminPage');

            if (page === 'home') {
                homePage.classList.remove('hidden');
                adminPage.classList.add('hidden');
            } else if (page === 'admin') {
                adminPage.classList.remove('hidden');
                homePage.classList.add('hidden');
            }
        }

        // Synchronize User Details & Expense Displays
        function updateHeaderAndFooter() {
            document.getElementById('headerUserName').innerText = appData.userName;
            document.getElementById('welcomeUserName').innerText = appData.userName;
            document.getElementById('footerUserName').innerText = appData.userName;
            document.getElementById('headerUserAvatar').src = appData.userAvatar;

            // Update settings preview & input
            document.getElementById('settingsAvatarPreview').src = appData.userAvatar;
            document.getElementById('settingsUserNameInput').value = appData.userName;

            // Calculate total expenses
            let total = 0;
            appData.items.forEach(item => {
                total += (item.price * item.quantity);
            });
            document.getElementById('headerTotalExpense').innerText = `${formatCurrency(total)} ج.م`;
        }

        // Update User Name from Admin Settings Page
        function updateUserNameFromSettings() {
            const input = document.getElementById('settingsUserNameInput');
            const newName = input.value.trim();
            if (newName) {
                appData.userName = newName;
                saveData();
                showToast('تم تحديث الاسم بنجاح');
            }
        }

        // Handle User Profile Avatar Upload
        function handleUserAvatarUpload(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    appData.userAvatar = e.target.result;
                    saveData();
                    showToast('تم تحديث الصورة الشخصية');
                };
                reader.readAsDataURL(file);
            }
        }

        // Preview uploaded image for item
        function previewItemImage(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('itemImageBase64').value = e.target.result;
                    document.getElementById('itemImageUrl').value = '';
                };
                reader.readAsDataURL(file);
            }
        }

        // Submit Item Form (Add / Edit)
        function handleFormSubmit(event) {
            event.preventDefault();

            const editingId = document.getElementById('editingItemId').value;
            const name = document.getElementById('itemName').value.trim();
            const price = parseFloat(document.getElementById('itemPrice').value);
            const quantity = parseInt(document.getElementById('itemQuantity').value);
            
            let image = document.getElementById('itemImageBase64').value;
            const imageUrlInput = document.getElementById('itemImageUrl').value.trim();

            if (!image) {
                if (imageUrlInput) {
                    image = imageUrlInput;
                } else if (!editingId) {
                    image = 'https://placehold.co/300x300/1e1435/facc15?text=صورة';
                }
            }

            if (editingId) {
                // Edit Existing
                const index = appData.items.findIndex(item => item.id == editingId);
                if (index !== -1) {
                    if (!image) {
                        image = appData.items[index].image;
                    }
                    appData.items[index] = {
                        id: Number(editingId),
                        name,
                        price,
                        quantity,
                        image
                    };
                    showToast('تم تحديث بيانات الصنف');
                }
            } else {
                // Add New
                if (!image) image = 'https://placehold.co/300x300/1e1435/facc15?text=صورة';
                const newItem = {
                    id: Date.now(),
                    name,
                    price,
                    quantity,
                    image
                };
                appData.items.unshift(newItem);
                showToast('تم إضافة الصنف بنجاح');
            }

            saveData();
            resetForm();
        }

        // Load Item Into Form For Editing
        function editItem(id) {
            const item = appData.items.find(i => i.id == id);
            if (item) {
                document.getElementById('editingItemId').value = item.id;
                document.getElementById('itemName').value = item.name;
                document.getElementById('itemPrice').value = item.price;
                document.getElementById('itemQuantity').value = item.quantity;
                document.getElementById('itemImageUrl').value = item.image.startsWith('data:') ? '' : item.image;
                document.getElementById('itemImageBase64').value = item.image.startsWith('data:') ? item.image : '';
                
                document.getElementById('formTitleText').innerHTML = `تعديل صنف: ${item.name}`;
                document.getElementById('submitFormBtn').innerHTML = `<i class="fa-solid fa-check"></i> <span>تحديث البيانات</span>`;
                document.getElementById('cancelEditBtn').classList.remove('hidden');

                switchPage('admin');
            }
        }

        // Reset Form Controls
        function resetForm() {
            document.getElementById('itemForm').reset();
            document.getElementById('editingItemId').value = '';
            document.getElementById('itemImageBase64').value = '';
            document.getElementById('itemQuantity').value = '1';
            document.getElementById('formTitleText').innerHTML = `إضافة صنف أو مصروف جديد`;
            document.getElementById('submitFormBtn').innerHTML = `<i class="fa-solid fa-plus"></i> <span>حفظ الصنف</span>`;
            document.getElementById('cancelEditBtn').classList.add('hidden');
        }

        // Delete Single Item
        function deleteItem(id) {
            if (confirm('هل أنت متأكد من حذف هذا الصنف؟')) {
                appData.items = appData.items.filter(item => item.id !== id);
                saveData();
                showToast('تم حذف الصنف');
            }
        }

        // Clear Entire List
        function clearAllItems() {
            if (confirm('هل أنت متأكد من حذف جميع المصاريف؟')) {
                appData.items = [];
                saveData();
                showToast('تم مسح جميع المصاريف');
            }
        }

        // Render Home Page Items Horizontal Cards
        function renderHomeItems() {
            const container = document.getElementById('homeItemsList');
            const badge = document.getElementById('homeItemsBadge');

            badge.innerText = `${appData.items.length} عنصر`;

            if (appData.items.length === 0) {
                container.innerHTML = `
                    <div class="py-12 text-center space-y-2">
                        <div class="w-12 h-12 bg-amber-500/10 text-amber-400 rounded-2xl flex items-center justify-center mx-auto text-lg border border-amber-500/20">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h4 class="text-xs font-bold text-white">لا توجد مصاريف مسجلة</h4>
                        <p class="text-[11px] text-slate-400">انتقل إلى صفحة الإعدادات لإضافة مصاريفك الأولى.</p>
                    </div>
                `;
                return;
            }

            let html = '';
            appData.items.forEach(item => {
                const totalPrice = item.price * item.quantity;
                html += `
                    <div class="bg-violetTheme-900/60 hover:bg-violetTheme-800/80 border border-amber-500/20 hover:border-amber-400/40 rounded-2xl p-3 sm:p-4 flex items-center justify-between gap-3 sm:gap-4 transition-all shadow-sm">
                        
                        <!-- Left Info: Fixed Dimension Image + Name + Details Inline -->
                        <div class="flex items-center gap-3 sm:gap-4 min-w-0">
                            <img src="${item.image}" alt="${item.name}" 
                                 onerror="this.src='https://placehold.co/300x300/1e1435/facc15?text=صورة'" 
                                 class="item-img-fixed border border-amber-500/30 shrink-0 shadow-md">
                            
                            <div class="min-w-0 flex flex-col justify-center">
                                <h4 class="text-xs sm:text-sm font-extrabold text-white truncate max-w-[140px] sm:max-w-xs">${item.name}</h4>
                                <div class="flex items-center gap-2 sm:gap-3 text-[11px] text-slate-400 mt-1 flex-wrap">
                                    <span>العدد: <strong class="text-amber-400 font-bold">${item.quantity}</strong></span>
                                    <span class="text-slate-600">•</span>
                                    <span>السعر: <strong class="text-slate-200 font-bold">${formatCurrency(item.price)} ج.م</strong></span>
                                </div>
                            </div>
                        </div>

                        <!-- Right Info: Item Total Expense -->
                        <div class="text-left shrink-0">
                            <span class="text-[10px] text-slate-400 block font-semibold">الإجمالي</span>
                            <span class="text-xs sm:text-sm font-black text-amber-400">${formatCurrency(totalPrice)} <span class="text-[10px] text-slate-400 font-normal">ج.م</span></span>
                        </div>

                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Render Admin Page Items Management List
        function renderAdminItems() {
            const container = document.getElementById('adminItemsList');

            if (appData.items.length === 0) {
                container.innerHTML = `
                    <div class="py-10 text-center text-xs text-slate-400">
                        القائمة فارغة حالياً.
                    </div>
                `;
                return;
            }

            let html = '';
            appData.items.forEach(item => {
                const totalPrice = item.price * item.quantity;
                html += `
                    <div class="bg-violetTheme-900/60 border border-amber-500/20 rounded-2xl p-3 flex items-center justify-between gap-3 transition">
                        
                        <div class="flex items-center gap-3 min-w-0">
                            <img src="${item.image}" alt="${item.name}" 
                                 onerror="this.src='https://placehold.co/300x300/1e1435/facc15?text=صورة'" 
                                 class="item-img-fixed border border-amber-500/30 shrink-0">
                            <div class="min-w-0">
                                <h4 class="text-xs font-bold text-white truncate">${item.name}</h4>
                                <span class="text-[11px] text-slate-400 block mt-0.5">
                                    ${item.quantity} × ${formatCurrency(item.price)} ج.م = <strong class="text-amber-400 font-bold">${formatCurrency(totalPrice)} ج.م</strong>
                                </span>
                            </div>
                        </div>

                        <!-- Action Buttons -->
                        <div class="flex items-center gap-1.5 shrink-0">
                            <button onclick="editItem(${item.id})" class="px-2.5 py-1.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500 hover:text-black transition text-xs font-bold flex items-center gap-1">
                                <i class="fa-solid fa-pen"></i>
                                <span class="hidden sm:inline">تعديل</span>
                            </button>
                            <button onclick="deleteItem(${item.id})" class="w-8 h-8 rounded-xl bg-rose-500/10 text-rose-400 border border-rose-500/20 hover:bg-rose-500 hover:text-white transition flex items-center justify-center text-xs">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>

                    </div>
                `;
            });

            container.innerHTML = html;
        }

        // Minimal Toast Notification
        function showToast(message) {
            const toast = document.createElement('div');
            toast.className = 'fixed bottom-5 left-1/2 -translate-x-1/2 z-50 bg-amber-400 text-black px-4 py-2 rounded-2xl font-extrabold text-xs shadow-lg transition-all animate-fade-in';
            toast.innerText = message;
            document.body.appendChild(toast);
            setTimeout(() => {
                toast.remove();
            }, 2500);
        }
        // دالة إظهار وإخفاء القائمة المنسدلة
        function toggleMenu() {
        const menu = document.getElementById('dropdownMenu');
        menu.classList.toggle('hidden');
        }

        // إغلاق القائمة تلقائياً إذا ضغط المستخدم في أي مكان خارجها
        window.addEventListener('click', function(e) {
        const menuBtn = document.getElementById('menuBtn');
        const dropdownMenu = document.getElementById('dropdownMenu');
        
        if (menuBtn && dropdownMenu && !menuBtn.contains(e.target) && !dropdownMenu.contains(e.target)) {
            dropdownMenu.classList.add('hidden');
        }
        });

        // Initial Setup
        window.onload = function() {
            updateHeaderAndFooter();
            renderHomeItems();
            renderAdminItems();
        };
    </script>
</body>
</html>
