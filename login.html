<!DOCTYPE html>
<html lang="ar" dir="rtl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>تسجيل الدخول ومزامنة البيانات</title>

    <meta name="theme-color" content="#030712">
    <meta name="color-scheme" content="dark">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        amber: { 400: '#facc15', 500: '#eab308', 600: '#ca8a04', 700: '#a16207' },
                        slate: { 800: '#1e293b', 900: '#0f172a', 950: '#030712' }
                    },
                    fontFamily: { sans: ['"Cairo"', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        html, body { height: 100%; }
        body {
            font-family: 'Cairo', system-ui, sans-serif;
            background-color: #030712;
            color: #f8fafc;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
            -webkit-font-smoothing: antialiased;
        }

        /* ===== الخلفية المتحركة ===== */
        .bg-glow-container {
            position: fixed; inset: 0; z-index: -1; pointer-events: none; overflow: hidden;
            background:
                radial-gradient(120% 80% at 50% 0%, #0b1220 0%, #030712 60%),
                #030712;
        }

        /* شفق (Aurora) بطبقات متحركة ببطء */
        .aurora {
            position: absolute; inset: -30%;
            filter: blur(70px);
            opacity: .55;
            will-change: transform;
        }
        .aurora.a1 {
            background:
                radial-gradient(40% 35% at 30% 30%, rgba(234,179,8,.55), transparent 70%),
                radial-gradient(35% 30% at 75% 65%, rgba(202,138,4,.35), transparent 70%);
            animation: drift1 18s ease-in-out infinite alternate;
        }
        .aurora.a2 {
            background:
                radial-gradient(35% 30% at 70% 25%, rgba(52,211,153,.30), transparent 70%),
                radial-gradient(40% 35% at 25% 75%, rgba(250,204,21,.22), transparent 70%);
            animation: drift2 24s ease-in-out infinite alternate;
        }
        @keyframes drift1 {
            0%   { transform: translate3d(-6%, -4%, 0) rotate(0deg) scale(1); }
            100% { transform: translate3d(8%, 6%, 0) rotate(14deg) scale(1.15); }
        }
        @keyframes drift2 {
            0%   { transform: translate3d(7%, 5%, 0) rotate(0deg) scale(1.1); }
            100% { transform: translate3d(-8%, -6%, 0) rotate(-16deg) scale(.95); }
        }

        /* شبكة دقيقة تتحرك ببطء وتتلاشى عند الأطراف */
        .grid-layer {
            position: absolute; inset: 0;
            background-image:
                linear-gradient(rgba(255,255,255,.045) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255,255,255,.045) 1px, transparent 1px);
            background-size: 44px 44px;
            -webkit-mask-image: radial-gradient(70% 60% at 50% 45%, #000 20%, transparent 75%);
                    mask-image: radial-gradient(70% 60% at 50% 45%, #000 20%, transparent 75%);
            animation: gridMove 30s linear infinite;
        }
        @keyframes gridMove { to { background-position: 44px 44px, 44px 44px; } }

        /* حبيبات ذهبية (Canvas) */
        #particles { position: absolute; inset: 0; width: 100%; height: 100%; }

        /* تعتيم خفيف أسفل الشاشة لإبراز الزر */
        .bg-vignette {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(3,7,18,.85) 0%, transparent 38%);
        }

        /* حلقات نابضة حول الشعار */
        .ring {
            position: absolute; inset: 0; border-radius: 2rem;
            border: 1px solid rgba(234,179,8,.45);
            animation: ringPulse 3.2s cubic-bezier(.2,.6,.3,1) infinite;
        }
        .ring.r2 { animation-delay: 1.6s; }
        @keyframes ringPulse {
            0%   { transform: scale(1);   opacity: .7; }
            100% { transform: scale(1.9); opacity: 0; }
        }

        /* الصفحة: ملء الشاشة على الموبايل مع احترام مناطق الأمان */
        .page {
            min-height: 100dvh;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
            padding-left: env(safe-area-inset-left, 0px);
            padding-right: env(safe-area-inset-right, 0px);
        }

        /* على الشاشات الكبيرة فقط: بطاقة زجاجية */
        @media (min-width: 640px) {
            .panel {
                background: linear-gradient(145deg, rgba(15, 23, 42, 0.78), rgba(3, 7, 18, 0.92));
                backdrop-filter: blur(24px);
                -webkit-backdrop-filter: blur(24px);
                border: 1px solid rgba(234, 179, 8, 0.22);
                box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.85), inset 0 1px 0 rgba(255, 255, 255, 0.08);
                border-radius: 2rem;
            }
        }

        .logo-badge {
            background: linear-gradient(145deg, rgba(234, 179, 8, 0.18), rgba(234, 179, 8, 0.05));
            border: 1px solid rgba(234, 179, 8, 0.35);
            box-shadow: 0 0 0 8px rgba(234, 179, 8, 0.05), 0 20px 40px -12px rgba(234, 179, 8, 0.35);
        }

        .feature-row {
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.07);
        }

        /* زر ذهبي - ارتفاع 56px لسهولة اللمس */
        .gold-btn {
            background: linear-gradient(135deg, #fef08a 0%, #eab308 55%, #ca8a04 100%);
            color: #030712;
            font-weight: 800;
            min-height: 56px;
            box-shadow: 0 12px 28px -8px rgba(234, 179, 8, 0.5);
            transition: transform .15s ease, box-shadow .2s ease, opacity .2s ease;
        }
        .gold-btn:active:not(:disabled) { transform: scale(0.98); }
        .gold-btn:disabled { opacity: .75; cursor: progress; }
        .gold-btn:focus-visible, .back-link:focus-visible {
            outline: 3px solid #fff;
            outline-offset: 3px;
        }
        @media (hover: hover) {
            .gold-btn:hover:not(:disabled) { box-shadow: 0 16px 32px -8px rgba(234, 179, 8, 0.65); filter: brightness(1.05); }
        }

        .g-logo { width: 28px; height: 28px; background: #fff; border-radius: 9999px; display: grid; place-items: center; flex-shrink: 0; }

        /* مؤشر التحميل */
        .spinner {
            width: 22px; height: 22px; border-radius: 50%;
            border: 3px solid rgba(3, 7, 18, 0.25); border-top-color: #030712;
            animation: spin .8s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* حركة دخول واحدة فقط */
        .enter { animation: enter .6s cubic-bezier(.16, 1, .3, 1) both; }
        @keyframes enter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }

        /* رسالة الحالة */
        .status {
            transition: opacity .25s ease, transform .25s ease;
        }
        .status.hidden-s { opacity: 0; transform: translateY(6px); pointer-events: none; height: 0; margin: 0; overflow: hidden; }

        @media (prefers-reduced-motion: reduce) {
            .enter, .spinner, .aurora, .grid-layer, .ring { animation: none; }
            .gold-btn { transition: none; }
        }
    </style>
</head>
<body class="relative">

    <div class="bg-glow-container" aria-hidden="true">
        <div class="aurora a1"></div>
        <div class="aurora a2"></div>
        <div class="grid-layer"></div>
        <canvas id="particles"></canvas>
        <div class="bg-vignette"></div>
    </div>

    <main class="page flex items-center justify-center sm:p-6">
        <div class="panel enter w-full max-w-md min-h-[100dvh] sm:min-h-0 flex flex-col px-6 pt-10 pb-6 sm:p-10">

            <!-- الجزء العلوي: الشعار والعنوان -->
            <section class="flex-1 flex flex-col items-center justify-center text-center gap-10 py-6">

                <div class="relative w-28 h-28" aria-hidden="true">
                    <span class="ring"></span><span class="ring r2"></span>
                    <div class="logo-badge relative w-full h-full rounded-[2rem] flex items-center justify-center text-amber-400 text-5xl">
                        <i class="fa-solid fa-cloud-arrow-up"></i>
                    </div>
                </div>

                <div class="space-y-3">
                    <h1 class="text-[1.9rem] leading-tight font-black text-white">مزامنة النسخة الاحتياطية</h1>
                    <p class="text-[0.95rem] text-slate-400 leading-7 max-w-[22rem] mx-auto">
                        سجّل الدخول بحساب جوجل لتبقى بياناتك محفوظة، وتجدها كما هي على أي جهاز.
                    </p>
                </div>
            </section>

            <!-- الجزء السفلي: الإجراءات (في متناول الإبهام) -->
            <section class="space-y-4 pt-2">

                <!-- رسالة حالة بدل alert -->
                <div id="status" role="status" aria-live="polite"
                     class="status hidden-s rounded-2xl px-4 py-3 text-sm font-semibold text-center"></div>

                <button id="loginBtn" type="button" onclick="loginWithGoogle()"
                        class="gold-btn w-full rounded-2xl text-[0.95rem] flex items-center justify-center gap-3 px-5">
                    <span class="g-logo" aria-hidden="true">
                        <svg width="16" height="16" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.5 5.8c4.4-4.1 7.1-10.1 7.1-17.5z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.5-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.5-5.8c-2.1 1.4-4.9 2.3-8.4 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
                    </span>
                    <span id="btnLabel">المتابعة بحساب جوجل</span>
                </button>

                <a href="index.html"
                   class="back-link flex items-center justify-center min-h-[48px] rounded-xl text-sm font-semibold text-slate-400 active:text-amber-400 transition-colors">
                    المتابعة بدون تسجيل
                </a>
            </section>
        </div>
    </main>

    <!-- حبيبات الخلفية -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import {
        getAuth, signInWithRedirect, getRedirectResult, GoogleAuthProvider, onAuthStateChanged, signOut
    } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAVDG_rU0WofeTdKwrmaxTiFAWsESKMueI",
        authDomain: "raouf-5b278.firebaseapp.com",
        projectId: "raouf-5b278",
        storageBucket: "raouf-5b278.firebasestorage.app",
        messagingSenderId: "955422937027",
        appId: "1:955422937027:web:e92e5666e1e2aabce83776",
        measurementId: "G-JMTM83E8B2"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const provider = new GoogleAuthProvider();

    const btn = document.getElementById('loginBtn');
    const label = document.getElementById('btnLabel');
    const statusEl = document.getElementById('status');

    function setLoading(on, text = 'جارٍ تسجيل الدخول…') {
        btn.disabled = on;
        btn.setAttribute('aria-busy', on ? 'true' : 'false');
        label.textContent = text;
    }

    function showStatus(msg, type) {
        statusEl.textContent = msg;
        statusEl.className = 'status rounded-2xl px-4 py-3 text-sm font-semibold text-center ' + (type === 'ok'
            ? 'bg-emerald-500/10 text-emerald-300 border border-emerald-500/30'
            : 'bg-red-500/10 text-red-300 border border-red-500/30');
    }

    function onSuccess(user) {
        localStorage.setItem('user_uid', user.uid);
        localStorage.setItem('user_email', user.email || '');
        showStatus(`مرحباً ${user.displayName || 'بأنك'}! تم تفعيل المزامنة بنجاح`, 'ok');
        setTimeout(() => { window.location.href = 'index.html'; }, 1000);
    }

    // التحقق عند فتح الصفحة مما إذا كان المستخدم مسجلاً بالفعل
    onAuthStateChanged(auth, (user) => {
        if (user) {
            localStorage.setItem('user_uid', user.uid);
            localStorage.setItem('user_email', user.email || '');
            showStatus(`أنت مسجل حالياً بريد: ${user.email}`, 'ok');
            label.textContent = "الذهاب للرئيسية";
            btn.onclick = () => { window.location.href = 'index.html'; };

            // إضافة زر تسجيل الخروج لو أراد تبديل الحساب
            if (!document.getElementById('logoutBtn')) {
                const logoutBtn = document.createElement('button');
                logoutBtn.id = 'logoutBtn';
                logoutBtn.className = 'w-full mt-2 py-3 bg-rose-500/10 text-rose-400 border border-rose-500/20 rounded-2xl text-xs font-bold transition';
                logoutBtn.innerText = 'تسجيل الخروج من الحساب';
                logoutBtn.onclick = async () => {
                    await signOut(auth);
                    localStorage.removeItem('user_uid');
                    localStorage.removeItem('user_email');
                    location.reload();
                };
                btn.parentNode.appendChild(logoutBtn);
            }
        }
    });

    // معالجة نتيجة إعادة التوجيه
    getRedirectResult(auth).then((result) => {
        if (result && result.user) {
            setLoading(true);
            onSuccess(result.user);
        }
    }).catch((error) => {
        showStatus('تعذر إكمال تسجيل الدخول. حاول مرة أخرى.', 'err');
    });

    window.loginWithGoogle = async function () {
        setLoading(true);
        statusEl.className = 'status hidden-s';
        try {
            await signInWithRedirect(auth, provider);
        } catch (error) {
            setLoading(false);
            showStatus('تعذّر تسجيل الدخول. حاول مرة أخرى.', 'err');
        }
    };
</script>
</body>
</html>
